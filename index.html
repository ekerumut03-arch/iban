<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>IBAN Bilgileri</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      background: #f4f4f4;

      font-family: -apple-system, BlinkMacSystemFont,
      "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

      color: #111;
    }

    .card {
      width: 100%;
      max-width: 430px;

      background: white;

      border-radius: 22px;

      padding: 35px 25px;

      box-shadow: 0 10px 35px rgba(0,0,0,0.08);

      text-align: center;
    }

    h1 {
      margin: 0;

      font-size: 30px;
      font-weight: 700;
    }

    .subtitle {
      margin-top: 8px;
      margin-bottom: 35px;

      font-size: 16px;

      color: #777;
    }

    .label {
      font-size: 13px;

      color: #888;

      margin-bottom: 8px;

      text-transform: uppercase;

      letter-spacing: 1px;
    }

    .iban {
      font-size: 20px;

      font-weight: 600;

      margin-bottom: 25px;

      word-break: break-word;
    }

    button {
      width: 100%;

      padding: 15px;

      margin-top: 10px;

      border: none;

      border-radius: 12px;

      font-size: 16px;

      font-weight: 600;

      cursor: pointer;
    }

    .iban-button {
      background: #111;
      color: white;
    }

    .name-button {
      background: #ededed;
      color: #111;
    }

    #message {
      height: 20px;

      margin-top: 15px;

      font-size: 14px;

      color: #22a447;
    }
  </style>

</head>

<body>

<div class="card">

  <!-- SADECE BURAYI DEĞİŞTİR -->
  <h1 id="name">ismail alver</h1>

  <div class="subtitle">
    Havale / EFT için IBAN bilgilerim
  </div>

  <div class="label">
    IBAN
  </div>

  <!-- SADECE BURAYI DEĞİŞTİR -->
  <div class="iban" id="iban">
    TR90 0001 0006 5169 6034 0650 01
  </div>

  <button
    class="iban-button"
    onclick="copyIBAN()">
    IBAN'ı kopyala
  </button>

  <button
    class="name-button"
    onclick="copyName()">
    Adı kopyala
  </button>

  <div id="message"></div>

</div>


<script>

function copyIBAN() {

  const iban =
  document.getElementById("iban")
  .innerText
  .replace(/\s/g, "");

  navigator.clipboard.writeText(iban);

  showMessage("IBAN kopyalandı ✓");

}


function copyName() {

  const name =
  document.getElementById("name")
  .innerText;

  navigator.clipboard.writeText(name);

  showMessage("Ad kopyalandı ✓");

}


function showMessage(text) {

  const message =
  document.getElementById("message");

  message.innerText = text;

  setTimeout(function() {

    message.innerText = "";

  }, 1800);

}

</script>

</body>
</html>
